name: Icon motion
description: An icon moves in a way that does not match what it shows
labels: [motion]
body:
  - type: input
    id: icon
    attributes:
      label: Icon name
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: How it should move
      description: Describe the movement you would expect for what the icon depicts.
    validations:
      required: true
